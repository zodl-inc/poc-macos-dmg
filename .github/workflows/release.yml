name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Resources/Info.plist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::907793002116:role/poc-macos-dmg-gha
          aws-region: us-east-1

      - name: Import Developer ID certificate + load notarization creds
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id /infra/apple/developer-id-macos \
            --query SecretString --output text)
          P12_B64=$(echo "$SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin)['p12_base64'])")
          P12_PASS=$(echo "$SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin)['p12_password'])")
          APPLE_ID=$(echo "$SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin)['apple_id'])")
          NOTARY_PASS=$(echo "$SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin)['notarytool_password'])")
          TEAM_ID=$(echo "$SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin)['team_id'])")

          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci-keychain /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security unlock-keychain -p ci-keychain /tmp/ci.keychain
          security import /tmp/cert.p12 -k /tmp/ci.keychain -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain /tmp/ci.keychain
          security set-keychain-settings -lut 3600 /tmp/ci.keychain
          rm /tmp/cert.p12

          xcrun notarytool store-credentials "notarytool-ci" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASS" \
            --keychain /tmp/ci.keychain

          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

      - name: Build app + sign + DMG
        run: chmod +x scripts/build-signed.sh && ./scripts/build-signed.sh

      - name: Notarize DMG
        run: |
          DMG=$(ls build/Zodl-*.dmg)
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" \
            --keychain-profile "notarytool-ci" \
            --keychain /tmp/ci.keychain \
            --wait \
            --timeout 10m
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "✅ Notarized and stapled: $DMG"

      - name: Compute SHA256 + sign with Ed25519 (after notarization)
        run: |
          DMG=$(ls build/Zodl-*.dmg)
          SHA256_FILE="${DMG%.dmg}.sha256"
          shasum -a 256 "$DMG" | awk '{print $1}' > "$SHA256_FILE"
          echo "SHA256: $(cat $SHA256_FILE)"

          SIGNING_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id /infra/apple/update-signing-key \
            --query SecretString --output text)
          echo "$SIGNING_SECRET" | python3 -c \
            "import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)['private_key_pem_b64']).decode())" \
            > /tmp/update_signing_key.pem
          pip3 install cryptography --quiet --break-system-packages 2>/dev/null || \
            pip3 install cryptography --quiet
          python3 scripts/sign-checksum.py /tmp/update_signing_key.pem "$SHA256_FILE"
          rm /tmp/update_signing_key.pem

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Zodl-*.dmg
            build/Zodl-*.sha256
            build/Zodl-*.sha256.sig.b64
          generate_release_notes: false
          body: |
            ## Zodl macOS PoC ${{ env.VERSION }}

            Signed + notarized with Developer ID Application (ZODL / RLPRR8CPQG).
            Opens without any Gatekeeper warning.

            ### Install
            Download the `.dmg`, open it, drag **Zodl.app** to Applications.

            ### Auto-update
            The app checks for updates 3s after launch and on every foreground.
            Prompts before installing. Verifies SHA256 + Ed25519 signature.
